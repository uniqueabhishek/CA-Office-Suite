[project]
name = "ca-office-suite"
version = "2.1.0"
description = "Comprehensive Office Suite for CA Firms"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "PyQt5==5.15.11",
    "PyQt5-Qt5==5.15.2",
    "PyQt5-sip==12.17.2",
    "pandas>=1.3.0,<3.0.0",
    "numpy>=1.21.0,<2.0.0",
    "openpyxl>=3.0.0,<4.0.0",
    "xlrd>=2.0.0,<3.0.0",
    "pdfplumber>=0.7.0,<1.0.0",
    "pdfminer.six>=20211012",
    "python-dateutil>=2.8.0,<3.0.0",
    "Pillow>=9.0.0,<11.0.0",
    "flask>=3.1.2",
    "werkzeug>=3.1.5",
    "gunicorn>=25.0.1",
    "requests>=2.28.0,<3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=7.0.0,<8.0.0",
    "pytest-qt>=4.0.0,<5.0.0",
    "pytest-cov>=3.0.0,<5.0.0",
    "pytest-mock>=3.10.0,<4.0.0",
    "flake8>=4.0.0,<7.0.0",
    "black>=22.0.0,<24.0.0",
    "isort>=5.10.0,<6.0.0",
    "pylint>=2.12.0,<4.0.0",
    "mypy>=0.950,<2.0.0",
    "types-python-dateutil>=2.8.0",
    "sphinx>=4.5.0,<8.0.0",
    "sphinx-rtd-theme>=1.0.0,<3.0.0",
    "recommonmark>=0.7.0,<1.0.0",
    "build>=0.7.0,<2.0.0",
    "pyinstaller>=5.0.0,<7.0.0",
    "wheel>=0.37.0,<1.0.0",
    "setuptools>=60.0.0,<70.0.0",
    "memory-profiler>=0.60.0,<1.0.0",
    "line-profiler>=3.5.0,<5.0.0",
    "ipython>=8.0.0,<9.0.0",
    "ipdb>=0.13.0,<1.0.0",
]
