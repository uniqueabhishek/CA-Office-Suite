[project]
name = "ca-office-suite"
version = "2.1.0"
description = "Comprehensive Office Suite for CA Firms"
# Upper bound tracks the numpy<2 pin below: numpy 1.x ships no wheels past
# CPython 3.12, so a 3.13+ environment would fall back to a source build.
requires-python = ">=3.10,<3.13"
readme = "README.md"
dependencies = [
    "PyQt5==5.15.11",
    "PyQt5-Qt5==5.15.2",
    "PyQt5-sip==12.17.2",
    "pandas>=1.3.0,<3.0.0",
    "numpy>=1.21.0,<2.0.0",
    "openpyxl>=3.0.0,<4.0.0",
    "xlrd>=2.0.0,<3.0.0",
    "pdfplumber>=0.7.0,<1.0.0",
    "pdfminer.six>=20211012",
    "python-dateutil>=2.8.0,<3.0.0",
    "Pillow>=9.0.0,<11.0.0",
    "flask>=3.1.2",
    "werkzeug>=3.1.5",
    # Production WSGI server for the Flask app (see Procfile). Gunicorn needs
    # fcntl, so it is skipped on Windows development machines.
    "gunicorn>=25.0.1; sys_platform != 'win32'",
    "requests>=2.28.0,<3.0.0",
]

[tool.uv]
# The suite is run from the repo root, not installed as a distribution, so uv
# manages the environment without building this project itself.
package = false

# Ruff is the whole lint-and-format toolchain: it replaces flake8, black, isort
# and pylint, and the same config drives both the CLI and the editor extension.
#
#   uv run ruff check .          # lint (add --fix to apply safe fixes)
#   uv run ruff format .         # format (add --check to verify only)
#
# Ruff honours .gitignore, so .venv, build, dist, legacy_backup and uploads are
# already skipped without listing them here.
[tool.ruff]
line-length = 120
# Inferred from requires-python, but pinned so UP rules cannot start suggesting
# 3.11+ syntax if that bound is ever relaxed.
target-version = "py310"

[tool.ruff.lint]
# E/W/F  pycodestyle + pyflakes   (was flake8)
# I      import ordering          (was isort)
# PL     pylint's ported checks   (was pylint)
# UP     modernise syntax for the 3.10 floor
# B      bugbear: likely-bug patterns (mutable defaults, late-binding closures)
# SIM    simplifications, RUF ruff-specific checks
#
# BLE    blind `except Exception`. Every existing one is a top-level guard that
#        turns a failure into a dialog, a flash message or a skipped file rather
#        than a dead UI thread, and carries `# noqa: BLE001` with the reason.
#        Keeping the rule on means any new one has to justify itself the same way.
select = ["E", "W", "F", "I", "PL", "UP", "B", "BLE", "SIM", "RUF"]
ignore = [
    # Magic-value comparisons: this code is full of Excel row/column indices
    # and Qt constants that are clearer inline than as named constants.
    "PLR2004",
    # Argument-count limit. Qt slots and the Flask helpers take what the
    # framework hands them; splitting them would add indirection, not clarity.
    "PLR0913",
    # Ruff's formatter owns wrapping, and E501 would still flag the long
    # string literals it deliberately leaves alone.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# A long test can be a long list of assertions; that is not complexity.
"tests/**" = ["PLR0915"]

[tool.ruff.lint.isort]
# blueprints and utils live under flask_app/ rather than the repo root, so the
# sorter cannot find them on its own and would file them as third-party.
known-first-party = ["blueprints", "config", "core", "tally_api", "ui", "utils", "workers"]

[tool.ruff.format]
# Match the black output the codebase was formatted with.
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# flask_app/ is a flat import root rather than a package: app.py and utils.py
# import each other by bare name, and gunicorn runs with --chdir flask_app.
# Putting it on mypy_path lets the type checker resolve those the same way.
[tool.mypy]
python_version = "3.10"
mypy_path = [".", "flask_app"]
ignore_missing_imports = true
# Almost nothing here is annotated, and without this mypy skips those function
# bodies entirely - it was reporting success while the editor found real None
# crashes in the Flask routes. Leave it on.
check_untyped_defs = true
exclude = "^(\\.venv|build|dist|legacy_backup|uploads)/"

# Pyright is what the editor's Pylance runs. Without this it does not know
# where the interpreter is, and treats flask_app/ imports as unresolvable the
# same way mypy did before mypy_path was set.
[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["flask_app"]
exclude = [".venv", "build", "dist", "legacy_backup", "uploads", "**/__pycache__"]

[dependency-groups]
dev = [
    "pytest>=7.0.0,<8.0.0",
    "pytest-qt>=4.0.0,<5.0.0",
    "pytest-cov>=3.0.0,<5.0.0",
    "pytest-mock>=3.10.0,<4.0.0",
    "mypy>=0.950,<2.0.0",
    "types-python-dateutil>=2.8.0",
    "types-requests>=2.28.0",
    "sphinx>=4.5.0,<8.0.0",
    "sphinx-rtd-theme>=1.0.0,<3.0.0",
    "recommonmark>=0.7.0,<1.0.0",
    "memory-profiler>=0.60.0,<1.0.0",
    "line-profiler>=3.5.0,<5.0.0",
    "ipython>=8.0.0,<9.0.0",
    "ipdb>=0.13.0,<1.0.0",
    "ruff>=0.16.6,<1.0.0",
]

# Only needed to freeze the desktop app into an executable. Not installed by a
# plain `uv sync`; run `uv sync --group packaging` when building a release.
packaging = [
    "pyinstaller>=5.0.0,<7.0.0",
]
