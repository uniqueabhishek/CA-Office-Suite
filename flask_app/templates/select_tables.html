<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Tables - PDF to Excel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .table-preview-container {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }
        .table-card {
            transition: all 0.2s;
        }
        .table-card:hover {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}"><i class="fas fa-file-excel me-2"></i>PDF to Excel</a>
    </div>
</nav>

<div class="container mb-5">
    <div class="row">
        <div class="col-12">
            <h2 class="mb-3 text-secondary">Results for: <span class="text-dark">{{ filename }}</span></h2>
            <p class="lead">Select the tables you want to include in your Excel file.</p>

            <form action="{{ url_for('convert') }}" method="post">

                <div class="fixed-bottom bg-white border-top p-3 shadow-lg" style="z-index: 1030;">
                    <div class="container d-flex justify-content-between align-items-center">
                        <div>
                            <span id="selection-count" class="fw-bold text-primary">0</span> tables selected
                        </div>
                        <div>
                            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary me-2">Cancel</a>
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-download me-2"></i>Download Excel
                            </button>
                        </div>
                    </div>
                </div>

                <div class="row">
                    {% for table in tables %}
                    <div class="col-12 mb-4">
                        <div class="card shadow-sm table-card">
                            <div class="card-header d-flex justify-content-between align-items-center bg-white">
                                <div class="form-check">
                                    <input class="form-check-input table-checkbox" type="checkbox"
                                           name="selected_tables"
                                           value="{{ table.page }}-{{ table.id }}"
                                           id="check_{{ table.page }}_{{ table.id }}"
                                           checked>
                                    <label class="form-check-label fw-bold" for="check_{{ table.page }}_{{ table.id }}">
                                        Page {{ table.page }} - Table {{ table.id }}
                                    </label>
                                </div>
                                <span class="badge bg-secondary">Page {{ table.page }}</span>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-preview-container p-2 bg-white">
                                    {{ table.html | safe }}
                                </div>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>

                <!-- Spacer for fixed bottom bar -->
                <div style="height: 100px;"></div>

            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const checkboxes = document.querySelectorAll('.table-checkbox');
        const countSpan = document.getElementById('selection-count');

        function updateCount() {
            const checked = document.querySelectorAll('.table-checkbox:checked').length;
            countSpan.textContent = checked;
        }

        checkboxes.forEach(cb => {
            cb.addEventListener('change', updateCount);
        });

        updateCount();
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
